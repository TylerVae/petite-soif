# Construit l'exe sur une machine Windows de GitHub et publie une Release.
# Déclencheur : pousser un tag "v1.0.0", "v1.1.0"… (gratuit sur un repo public).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # bouton "Run workflow" pour un build de test sans Release

permissions:
  contents: write # nécessaire uniquement pour créer la Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dépendances (versions figées)
        run: python -m pip install -r requirements-build.txt

      - name: Build PyInstaller
        run: python -m PyInstaller --noconfirm --clean petite_soif.spec

      - name: Zip + empreinte SHA-256
        shell: pwsh
        run: |
          $name = "PetiteSoif-${{ github.ref_name }}-windows"
          Compress-Archive -Path dist/PetiteSoif -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          Get-Content "$name.zip.sha256"

      - name: Build de test (sans Release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: PetiteSoif-test
          path: PetiteSoif-*-windows.zip*

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "PetiteSoif-${{ github.ref_name }}-windows.zip"
          ./tools/release_notes.ps1 "${{ github.ref_name }}" $zip | Out-File -Encoding utf8 notes.md
          gh release create "${{ github.ref_name }}" $zip "$zip.sha256" --title "Petite Soif ${{ github.ref_name }}" --notes-file notes.md
